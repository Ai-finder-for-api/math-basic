name: Build and Publish C++ Extension to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like "v0.1.0"
  workflow_dispatch: # Allows you to trigger it manually from GitHub UI

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Compiles for Windows, macOS (Intel & Apple Silicon), and Linux
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cibuildwheel

      - name: Build source distribution (sdist)
        run: python -m build --sdist --outdir wheelhouse

      - name: Build C++ wheels (cibuildwheel)
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Tell cibuildwheel to build for Python 3.9 to 3.12
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          # Skip 32-bit builds and niche Linux architectures to save time
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"

      - name: Upload built wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-wheels-${{ matrix.os }}
          path: ./wheelhouse/*

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment: pypiZA # Matches the environment name in your screenshot
    
    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}