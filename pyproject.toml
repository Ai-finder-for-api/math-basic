[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "math-basic"
version = "1.0.1"
description = "High-performance SIMD-accelerated math library featuring N-Dimensional arrays, 3D math, color spaces, and quantum computing simulations."
requires-python = ">=3.9"

[tool.scikit-build]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/math_basic"]
